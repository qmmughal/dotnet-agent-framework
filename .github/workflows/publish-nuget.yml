name: Publish to NuGet

on:
  push:
    tags: ["v*"] # Triggers on version tags like v0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AgentFramework.slnx

      - name: Build
        run: dotnet build AgentFramework.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AgentFramework.slnx --configuration Release --no-build

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          dotnet pack AgentFramework.Core/AgentFramework.Core.csproj -c Release -o ./nupkgs -p:Version=${{ env.PACKAGE_VERSION }}
          dotnet pack AgentFramework.Memory/AgentFramework.Memory.csproj -c Release -o ./nupkgs -p:Version=${{ env.PACKAGE_VERSION }}
          dotnet pack AgentFramework.Orchestration/AgentFramework.Orchestration.csproj -c Release -o ./nupkgs -p:Version=${{ env.PACKAGE_VERSION }}
          dotnet pack AgentFramework.Providers.OpenAI/AgentFramework.Providers.OpenAI.csproj -c Release -o ./nupkgs -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
